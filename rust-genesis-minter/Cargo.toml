[package]
name = "rust-genesis-minter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[[bin]]
name = "vinos-genesis"
path = "src/main.rs"

[dependencies]
rust-mint-benchmark = { path = "../rust-mint-benchmark" }
alloy-primitives = { version = "=1.6.0", features = ["serde", "k256"] }
alloy-sol-types = "=1.6.0"
# Pin the matching code generator family: newer semver-compatible generators
# emit APIs absent from the researched Alloy1.6 codec.
alloy-sol-macro = "=1.6.0"
alloy-sol-macro-input = "=1.6.0"
alloy-sol-macro-expander = "=1.6.0"
syn-solidity = "=1.6.0"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.44", features = ["rt", "macros", "net", "time", "signal", "io-util", "fs", "sync"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
